<!DOCTYPE html>
<html>

<head>
    <title>CRTD Payment</title>
</head>

<body>

    <h2>CRTD Subscription</h2>

    <button id="pay-btn">Pay ₹500</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>

        document.getElementById("pay-btn").onclick = function () {

            fetch("http://127.0.0.1:8000/payments/create-order/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            })
                .then(res => res.json())
                .then(data => {

                    var options = {

                        key: data.key,
                        amount: data.amount,
                        currency: "INR",
                        order_id: data.order_id,

                        name: "CRTD Portal",
                        description: "6 Month Subscription",

                        handler: function (response) {

                            fetch("http://127.0.0.1:8000/payments/verify-payment/", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify(response)
                            })
                                .then(res => res.json())
                                .then(data => {
                                    alert("Payment Successful");
                                    console.log(data);
                                });

                        }

                    };

                    var rzp = new Razorpay(options);
                    rzp.open();

                });

        }

    </script>

</body>

</html>
