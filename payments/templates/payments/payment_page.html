<!DOCTYPE html>
<html>

<head>
    <title>CRTD Payment</title>
</head>

<body>

    <h2>CRTD Subscription</h2>

    <button id="pay-btn">Pay ₹500</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>

        document.getElementById("pay-btn").onclick = async function () {

            // 🔐 Paste your JWT access token here
            const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzc1NjE0MDIzLCJpYXQiOjE3NzU1ODUyMjMsImp0aSI6ImJlNjIzMmM2N2EwMjQzZTFiYmQ3ZDIzNTQ5ZmY1ZTdmIiwidXNlcl9pZCI6IjEifQ.0_cgdBffRf_kZRCCFGFRD2y8okzvkWjsphyc46EmHWk";

            try {
                // 1️⃣ Create Order
                const response = await fetch("http://127.0.0.1:8000/api/payments/create-order/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token   // ✅ IMPORTANT
                    }
                });

                const data = await response.json();
                console.log("CREATE ORDER:", data);

                if (!response.ok) {
                    alert(data.detail || data.error || "Failed to create order");
                    return;
                }

                // 2️⃣ Razorpay Popup
                const options = {
                    key: data.key,
                    amount: data.amount,
                    currency: "INR",
                    order_id: data.order_id,

                    name: "CRTD Portal",
                    description: "6 Month Subscription",

                    handler: async function (response) {

                        try {
                            // 3️⃣ Verify Payment
                            const verifyRes = await fetch("http://127.0.0.1:8000/api/payments/verify-payment/", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    "Authorization": "Bearer " + token   // ✅ IMPORTANT
                                },
                                body: JSON.stringify({
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_signature: response.razorpay_signature
                                })
                            });

                            const verifyData = await verifyRes.json();
                            console.log("VERIFY:", verifyData);

                            if (verifyRes.ok) {
                                alert("Payment Successful ✅");
                            } else {
                                alert("Verification Failed ❌");
                            }

                        } catch (err) {
                            console.error("VERIFY ERROR:", err);
                            alert("Verification error");
                        }
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();

            } catch (err) {
                console.error("CREATE ORDER ERROR:", err);
                alert("Something went wrong");
            }
        };

    </script>

</body>

</html>
