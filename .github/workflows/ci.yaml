name: Django CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 — Run Tests
  # ────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: crtd.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-dummy-password
      RAZORPAY_KEY_ID: dummy
      RAZORPAY_KEY_SECRET: dummy
      RAZORPAY_WEBHOOK_SECRET: dummy
      GOOGLE_OAUTH_CLIENT_ID: dummy
      GOOGLE_OAUTH_CLIENT_SECRET: dummy
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Run migrations
        run: python manage.py migrate --noinput

      - name: ✅ Run tests
        run: python manage.py test --verbosity=2

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Security Scans (code + dependencies + filesystem)
  # ────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    needs: test

    permissions:
      actions: read
      contents: read

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      # ── Bandit: static code analysis ──────────────────────
      - name: 🕵️ Bandit — static code security analysis
        run: |
          bandit -r . \
            --exclude ./.venv,./venv,./env,./tests \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r . \
            --exclude ./.venv,./venv,./env,./tests \
            --severity-level medium \
            --confidence-level medium

      - name: 📋 Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      # ── Safety: dependency vulnerability check ─────────────
      - name: 🛡️ Safety — dependency vulnerability check
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          safety scan --output json > safety-report.json || true
          safety scan

      - name: 📋 Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

      # ── Trivy: filesystem scan (secrets + vulns) ───────────
      - name: 🔍 Trivy — filesystem scan (secrets + vulns)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs-report.txt
          exit-code: "1"               # fail pipeline on HIGH or CRITICAL
          severity: HIGH,CRITICAL
          scanners: vuln,secret

      - name: 📋 Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt

  # ────────────────────────────────────────────────────────────
  # JOB 3 — Build Docker image & scan it with Trivy
  # ────────────────────────────────────────────────────────────
  docker-scan:
    name: 🐳 Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: security

    permissions:
      actions: read
      contents: read

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔨 Build Docker image
        run: docker build -t crtd-backend-image:ci .

      - name: 🔍 Trivy — scan Docker image (secrets + vulns)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: crtd-backend-image:ci
          format: table
          output: trivy-image-report.txt
          exit-code: "1"               # fail pipeline on HIGH or CRITICAL
          severity: HIGH,CRITICAL
          scanners: vuln,secret

      - name: 📋 Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

  # ────────────────────────────────────────────────────────────
  # JOB 4 — Deploy to server (push to dev only)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy Backend to Server
    runs-on: ubuntu-latest
    needs: docker-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: 🐳 SSH & Deploy via Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "──────────────────────────────────────"
            echo "👤 Switching to test-deploy user"
            echo "──────────────────────────────────────"
            sudo su - test-deploy << 'EOF'
            set -e

            echo "──────────────────────────────────────"
            echo "📁 Moving into project directory"
            echo "──────────────────────────────────────"
            cd app/crtd-backend/crtd-backend-v2

            echo "──────────────────────────────────────"
            echo "⬇️  Pulling latest code from dev"
            echo "──────────────────────────────────────"
            git pull origin dev

            echo "──────────────────────────────────────"
            echo "🛑 Stopping running container (if any)"
            echo "──────────────────────────────────────"
            docker stop backend || true
            docker rm   backend || true

            echo "──────────────────────────────────────"
            echo "🗑️  Removing old Docker image (if any)"
            echo "──────────────────────────────────────"
            docker rmi backend || true

            echo "──────────────────────────────────────"
            echo "🔨 Building new Docker image"
            echo "──────────────────────────────────────"
            docker build -t backend .

            echo "──────────────────────────────────────"
            echo "🔎 Verifying image was created"
            echo "──────────────────────────────────────"
            docker images | grep backend

            echo "──────────────────────────────────────"
            echo "▶️  Running new container"
            echo "──────────────────────────────────────"
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 8000:8000 \
              backend

            echo "──────────────────────────────────────"
            echo "🧹 Cleaning up unused Docker resources"
            echo "──────────────────────────────────────"
            docker image prune -f

            echo "──────────────────────────────────────"
            echo "✅ Backend deployed successfully!"
            echo "Container status:"
            docker ps | grep backend
            echo "──────────────────────────────────────"
            echo "🏥 Checking app health"
            echo "──────────────────────────────────────"
            curl -sI http://localhost:8000
            EOF
