name: Django CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: crtd.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-dummy-password
      RAZORPAY_KEY_ID: dummy
      RAZORPAY_KEY_SECRET: dummy
      RAZORPAY_WEBHOOK_SECRET: dummy
      GOOGLE_OAUTH_CLIENT_ID: dummy
      GOOGLE_OAUTH_CLIENT_SECRET: dummy
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Run migrations
        run: python manage.py migrate --noinput

      - name: ✅ Run tests
        run: python manage.py test --verbosity=2
  security:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    needs: test           # only run if tests pass

    permissions:
      security-events: write    # required to upload SARIF to GitHub Security tab
      actions: read
      contents: read

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: 🕵️ Bandit — static code security analysis
        run: |
          bandit -r . \
            --exclude ./.venv,./venv,./env,./tests \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r . \
            --exclude ./.venv,./venv,./env,./tests \
            --severity-level medium \
            --confidence-level medium

      - name: 📋 Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: 🛡️ Safety — dependency vulnerability check
        run: |
          safety scan --output json > safety-report.json || true
          safety scan

      - name: 📋 Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json

      - name: 🔍 Trivy — filesystem scan (secrets + vulns)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"               # fail pipeline if HIGH or CRITICAL found
          severity: HIGH,CRITICAL
          scanners: vuln,secret

      - name: 📋 Trivy — upload SARIF report to GitHub Security tab
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret

      - name: 📤 Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
  deploy:
    name: 🚀 Build & Deploy on Server
    runs-on: ubuntu-latest
    needs: security          
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Copy code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "/home/ubuntu/crtd-backend"
          rm: true                     

      - name: 🐳 Build image & run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e  
            APP_DIR="/home/ubuntu/crtd-backend"
            CONTAINER_NAME="crtd-backend"
            IMAGE_NAME="crtd-backend-image"

            echo "──────────────────────────────────────"
            echo "📁 Moving into project directory"
            echo "──────────────────────────────────────"
            cd $APP_DIR

            echo "──────────────────────────────────────"
            echo "🛑 Stopping running container (if any)"
            echo "──────────────────────────────────────"
            docker stop $CONTAINER_NAME || true
            docker rm   $CONTAINER_NAME || true

            echo "──────────────────────────────────────"
            echo "🗑️  Removing old Docker image (if any)"
            echo "──────────────────────────────────────"
            docker rmi $IMAGE_NAME || true

            echo "──────────────────────────────────────"
            echo "🔨 Building new Docker image"
            echo "──────────────────────────────────────"
            docker build -t $IMAGE_NAME .
            docker images | grep $IMAGE_NAME

            echo "──────────────────────────────────────"
            echo "▶️  Running new container"
            echo "──────────────────────────────────────"
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file $APP_DIR/.env \
              $IMAGE_NAME

            echo "──────────────────────────────────────"
            echo "✅ Deployment complete!"
            echo "Container status:"
            docker ps | grep $CONTAINER_NAME
            echo "──────────────────────────────────────"
