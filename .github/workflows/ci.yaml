name: Django CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: crtd.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-dummy-password
      RAZORPAY_KEY_ID: dummy
      RAZORPAY_KEY_SECRET: dummy
      RAZORPAY_WEBHOOK_SECRET: dummy
      GOOGLE_OAUTH_CLIENT_ID: dummy
      GOOGLE_OAUTH_CLIENT_SECRET: dummy
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity=2

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      # Bandit — Python SAST, fails hard on medium+ severity
      # Report saved as JSON artifact for audit trail
      - name: Bandit SAST
        run: |
          bandit -r . \
            --exclude ./.venv,./venv,./env,./tests \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report-${{ github.sha }}
          path: bandit-report.json
          retention-days: 30
          
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/django
            p/secrets
            p/owasp-top-ten

      - name: pip-audit
        run: pip-audit -r requirements.txt

      - name: TruffleHog — Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          scanners: "vuln,secret"

  docker-scan:
    name: Docker Scan
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - run: docker build -t crtd-backend-image:ci .

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: crtd-backend-image:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: crtd-backend-image:ci
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend-${{ github.sha }}
          path: sbom-backend.spdx.json
          retention-days: 30

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-scan
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo su - test-deploy << 'EOF'
            set -e
            cd app/crtd-backend/crtd-backend-v2
            git fetch origin
            git reset --hard origin/staging
            docker stop backend celery celery-beat || true
            docker rm -f backend celery celery-beat || true
            docker rmi -f backend || true
            docker-compose up -d --build
            docker image prune -f
            sleep 15
            curl -sI http://localhost/api
            EOF

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: docker-scan
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo su - dev-deploy << 'EOF'
            set -e

            echo ">>> Moving into project directory"
            cd app/crtd-backend-v2

            echo ">>> Pulling latest code from dev"
            git fetch origin
            git reset --hard origin/dev

            echo ">>> Stopping and removing old containers"
            docker stop dev-b dev-c dev-cb || true
            docker rm -f dev-b dev-c dev-cb || true

            echo ">>> Removing old backend image"
            docker rmi -f dev-b || true

            echo ">>> Rebuilding and starting via docker-compose"
            docker-compose up -d --build

            echo ">>> Pruning unused Docker images"
            docker image prune -f

            echo ">>> Waiting for container to be ready"
            sleep 15

            echo ">>> Health check"
            curl -sI http://localhost:5000

            echo ">>> Deployed successfully!"
            docker ps | grep dev-b
            EOF

  dast-dev:
    name: DAST Scan (Dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.DEV_BACKEND_URL }}
          docker_args: "--user root"
          fail_action: true
          cmd_options: "-a"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-backend-${{ github.sha }}
          path: report_html.html
          retention-days: 30
