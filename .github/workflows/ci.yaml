name: Django CI/CD Pipeline
 
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
 
jobs:
  # ─────────────────────────────────────────────
  # JOB 1 · TEST
  # Runs Django unit tests against a real PostgreSQL service container
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
 
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
    env:
      # These are used by Django settings during tests
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: crtd.settings          # ← change to your settings module
      SECRET_KEY: ci-secret-key-not-for-production   # dummy key for CI only
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"
 
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
 
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"           # ← change to your Python version
          cache: "pip"
 
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: 🗄️ Run migrations
        run: python manage.py migrate --noinput
 
      - name: ✅ Run tests
        run: python manage.py test --verbosity=2
 
  # ─────────────────────────────────────────────
  # JOB 2 · SECURITY SCAN
  # Bandit  → static code analysis for Python security issues
  # Safety  → checks dependencies for known CVEs
  # Trivy   → filesystem scan for secrets & vulnerabilities
  # ─────────────────────────────────────────────
  security:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    needs: test           # only run if tests pass
 
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
 
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
 
      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
 
      - name: 🕵️ Bandit — static code security analysis
        run: |
          bandit -r . \
            --exclude ./.venv,./venv,./env,./tests \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r . \
            --exclude ./.venv,./venv,./env,./tests \
            --severity-level medium \
            --confidence-level medium
 
      - name: 📋 Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
 
      - name: 🛡️ Safety — dependency vulnerability check
        run: |
          safety check \
            --file requirements.txt \
            --output json > safety-report.json || true
          safety check --file requirements.txt
 
      - name: 📋 Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
 
      - name: 🔍 Trivy — filesystem scan (secrets + vulns)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"               # fail pipeline if HIGH or CRITICAL found
          severity: HIGH,CRITICAL
          scanners: vuln,secret        # scan both vulnerabilities and secrets
 
      - name: 📋 Trivy — upload SARIF report to GitHub Security tab
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          scanners: vuln,secret
 
      - name: 📤 Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif