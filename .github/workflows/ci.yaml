name: Django CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
  pull_request:
    branches:
      - dev
      - staging

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 — Run Tests
  # ────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
      DJANGO_SETTINGS_MODULE: crtd.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-dummy-password
      RAZORPAY_KEY_ID: dummy
      RAZORPAY_KEY_SECRET: dummy
      RAZORPAY_WEBHOOK_SECRET: dummy
      GOOGLE_OAUTH_CLIENT_ID: dummy
      GOOGLE_OAUTH_CLIENT_SECRET: dummy
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity=2

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Security Scans
  # ────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Bandit
        run: |
          bandit -r . --exclude ./.venv,./venv,./env,./tests \
          --severity-level medium --confidence-level medium || true

      - name: pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Trivy FS
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ────────────────────────────────────────────────────────────
  # JOB 3 — Docker Scan
  # ────────────────────────────────────────────────────────────
  docker-scan:
    name: 🐳 Docker Scan
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t crtd-backend-image:ci .

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: crtd-backend-image:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ────────────────────────────────────────────────────────────
  # JOB 4 — Deploy (ONLY for staging)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-scan

    # 🔥 IMPORTANT CONDITION
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo su - test-deploy << 'EOF'
            set -e
            cd app/crtd-backend/crtd-backend-v2
            git pull origin staging
            docker stop backend || true
            docker rm -f backend || true
            docker rmi -f backend || true
            docker image prune -f
            docker-compose up -d --build
            docker image prune -f
            sleep 5
            curl -sI http://localhost:8000
            EOF
