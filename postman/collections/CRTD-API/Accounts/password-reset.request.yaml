$kind: http-request
name: Password Reset
method: POST
url: '{{baseUrl}}/api/accounts/password-reset/'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "new_password": "newpassword123"
    }
description: Reset password after verified password_reset OTP.
