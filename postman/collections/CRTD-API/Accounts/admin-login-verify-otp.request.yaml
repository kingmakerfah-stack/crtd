$kind: http-request
name: Admin Login Verify OTP
method: POST
url: '{{baseUrl}}/api/accounts/admin/login/verify-otp/'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@example.com",
      "otp": "123456"
    }
description: 'Admin/Subadmin 2FA login - step 2, verify OTP.'
