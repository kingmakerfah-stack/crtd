$kind: http-request
name: Update Education (Partial)
method: PATCH
url: '{{baseUrl}}/api/student/profile/education/'
order: 7000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "qualification": "M.Tech"
    }
description: Partially update the authenticated student's education details.
