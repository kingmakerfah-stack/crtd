$kind: http-request
name: Create Job
method: POST
url: '{{baseUrl}}/api/jobs/'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Software Engineer",
      "description": "Job description here",
      "location": "Remote",
      "salary": "50000"
    }
description: Create a new job listing.
