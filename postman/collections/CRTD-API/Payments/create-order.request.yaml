$kind: http-request
name: Create Order
method: POST
url: '{{baseUrl}}/payments/create-order/'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 1000,
      "currency": "INR"
    }
description: Create a Razorpay payment order.
